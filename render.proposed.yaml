# PROPOSED Render Blueprint for PFAI — REVIEW ONLY (not applied / not deployed)
# Source of truth candidate: replace render.yaml after owner approval.
# Requirements:
#   - Git repo connected to Render (GitHub/GitLab/Bitbucket)
#   - Owner secrets set in Render Dashboard (sync:false keys below)
#   - MODEL_V0007 active data must be provisioned onto the persistent disk
#     (disk starts empty unless seeded; plan seeding after first deploy approval)
# Do NOT deploy until owner approves this Blueprint.

services:
  - type: web
    name: pfai-v8
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ""  # use Dockerfile CMD (uvicorn on $PORT)
    healthCheckPath: /health
    autoDeploy: false          # manual until first verified production deploy
    autoDeployTrigger: off
    numInstances: 1            # required when persistent disk is attached
    envVars:
      - key: PFAI_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: PFAI_LOG_LEVEL
        value: INFO
      - key: PFAI_ENV
        value: production
      - key: PFAI_TRAINING_ROOT
        value: data/longevity/training_phase9_verify
      - key: PFAI_CONTINUOUS_TRAINING_ENABLED
        value: "false"
      - key: PFAI_WEB_ALLOW_NETWORK
        value: "1"
      - key: PFAI_WEB_SEARCH_PROVIDER
        value: auto
      - key: PFAI_WEB_FETCH_PROVIDER
        value: http_fetch
      - key: PFAI_WEB_TIMEOUT
        value: "20"
      - key: PFAI_WEB_ALLOW_PRIVATE
        value: "0"
      - key: PFAI_COOKIE_SECURE
        value: "true"
      # --- secrets (Render Dashboard / env group; never commit values) ---
      - key: PFAI_OWNER_EMAIL
        sync: false
      - key: PFAI_OWNER_SECRET_HASH
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PFAI_LOCAL_MODEL_ID
        sync: false
      - key: PFAI_CORS_ORIGINS
        sync: false
    disk:
      name: pfai-data
      mountPath: /app/data
      sizeGB: 10
