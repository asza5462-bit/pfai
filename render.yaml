# AURUM — Elite Gold Desk on Render (control plane + paper mode)
# Live Exness execution requires Windows VPS with MetaTrader 5 (see /api/connect-guide).

services:
  - type: web
    name: pfai-v8
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ""
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: AURUM_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: AURUM_MODE
        value: "paper"
      - key: AURUM_SYMBOL
        value: "XAUUSD"
      - key: AURUM_TIMEFRAME
        value: "M15"
      - key: AURUM_AUTO_TRADE
        value: "false"
      - key: AURUM_OPEN_REGISTER
        value: "1"
      - key: AURUM_COOKIE_SECURE
        value: "1"
      - key: AURUM_RISK_PCT
        value: "0.35"
      - key: AURUM_MAX_DAILY_LOSS_PCT
        value: "1.25"
      - key: AURUM_MIN_RR
        value: "2.2"
      - key: AURUM_MIN_CONFLUENCE
        value: "0.62"
      - key: AURUM_MAX_SPREAD
        value: "45"
      - key: AURUM_LOOP_SECONDS
        value: "6"
      - key: AURUM_TICK_SECONDS
        value: "0.5"
      - key: AURUM_PULSE_CONFIRM
        value: "true"
      - key: AURUM_COOLDOWN_SEC
        value: "120"
      - key: AURUM_MAX_HOLD_SEC
        value: "10800"
      - key: AURUM_DATA_DIR
        value: "data/goldbot"
      - key: AURUM_PAPER_BALANCE
        value: "10000"
      # Secrets — set in Render dashboard, never commit:
      # AURUM_OWNER_TOKEN, MT5_LOGIN, MT5_PASSWORD, MT5_SERVER, MT5_PATH
