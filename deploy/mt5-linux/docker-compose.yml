# AURUM companion: MetaTrader 5 on Linux (Wine) — NO Windows OS required.
# Builds from upstream headless-mt5 (public GHCR image is often private).
#
# Usage on any x86_64 Linux VPS with Docker:
#   cd deploy/mt5-linux
#   cp .env.example .env
#   ./setup.sh
#   open http://YOUR_IP:3000  → log into Exness MT5 once
#   in AURUM → paste http://YOUR_IP:5001

services:
  mt5:
    build:
      context: https://github.com/thanderoy/headless-mt5.git#develop
    image: aurum-mt5-linux:local
    restart: unless-stopped
    environment:
      TZ: UTC
      CUSTOM_USER: ${VNC_USER:-aurum}
      PASSWORD: ${VNC_PASSWORD:-changeme}
    ports:
      - "3000:3000"
      - "5001:5001"
    volumes:
      - mt5_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s

volumes:
  mt5_config:
