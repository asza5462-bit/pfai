# AURUM companion: MetaTrader 5 on Linux (Wine) — NO Windows OS required.
# Compatible REST API: thanderoy/headless-mt5
#
# Usage on any x86_64 Linux VPS with Docker:
#   cd deploy/mt5-linux
#   cp .env.example .env   # set VNC password
#   docker compose up -d
#   open http://YOUR_IP:3000  → log into Exness MT5 once
#   in AURUM → ربط Exness → paste http://YOUR_IP:5001
#
# Then AURUM on Render places real Exness orders through this container.

services:
  mt5:
    image: ghcr.io/thanderoy/headless-mt5:latest
    # If the image is unavailable, build from upstream:
    # build: https://github.com/thanderoy/headless-mt5.git#develop
    restart: unless-stopped
    environment:
      TZ: UTC
      CUSTOM_USER: ${VNC_USER:-aurum}
      PASSWORD: ${VNC_PASSWORD:-changeme}
    ports:
      # Prefer binding to a private IP / reverse-proxy with TLS+auth in production
      - "3000:3000"   # VNC web desktop (one-time Exness login)
      - "5001:5001"   # REST trading API for AURUM
    volumes:
      - mt5_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s

volumes:
  mt5_config:
