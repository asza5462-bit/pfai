services:
  pfai:
    build: .
    image: pfai:8.0.0
    ports:
      - "8000:8000"
    environment:
      PFAI_HOST: "0.0.0.0"
      PORT: "8000"
      PFAI_LOG_LEVEL: "${PFAI_LOG_LEVEL:-INFO}"
      PFAI_OWNER_EMAIL: "${PFAI_OWNER_EMAIL}"
      PFAI_OWNER_SECRET_HASH: "${PFAI_OWNER_SECRET_HASH}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      PFAI_CONTINUOUS_TRAINING_ENABLED: "${PFAI_CONTINUOUS_TRAINING_ENABLED:-true}"
      PFAI_CORS_ORIGINS: "${PFAI_CORS_ORIGINS:-}"
      PFAI_LOCAL_MODEL_ID: "${PFAI_LOCAL_MODEL_ID:-}"
    volumes:
      - pfai-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  pfai-continuous:
    profiles: ["continuous"]
    build: .
    image: pfai:8.0.0
    command: ["python", "run_continuous.py"]
    environment:
      PFAI_LOG_LEVEL: "${PFAI_LOG_LEVEL:-INFO}"
      PFAI_OWNER_EMAIL: "${PFAI_OWNER_EMAIL}"
      PFAI_OWNER_SECRET_HASH: "${PFAI_OWNER_SECRET_HASH}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      PFAI_CONTINUOUS_TRAINING_ENABLED: "${PFAI_CONTINUOUS_TRAINING_ENABLED:-true}"
      PFAI_LOCAL_MODEL_ID: "${PFAI_LOCAL_MODEL_ID:-}"
    volumes:
      - pfai-data:/app/data
    restart: unless-stopped
    depends_on:
      - pfai

volumes:
  pfai-data:
