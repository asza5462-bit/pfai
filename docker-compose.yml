services:
  pfai:
    build: .
    image: pfai:8.2.0
    # Host networking required when docker bridge egress is unavailable in this runtime.
    network_mode: host
    # All production secrets/config come from the secret store (never committed).
    env_file:
      - ../runtime/production.env
    environment:
      PFAI_HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      # Bind-mount preserves MODEL_V0007 / LKG / web evidence for local production runs.
      - ${PFAI_DATA_MOUNT:-./app/data}:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  pfai-continuous:
    profiles: ["continuous"]
    build: .
    image: pfai:8.2.0
    command: ["python", "run_continuous.py"]
    env_file:
      - ../runtime/production.env
    volumes:
      - ${PFAI_DATA_MOUNT:-./app/data}:/app/data
    restart: unless-stopped
    depends_on:
      - pfai
